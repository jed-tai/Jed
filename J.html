<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#0d1f33;--mut:#64748b;--pri:#0e6e8c;--acc:#b98432;--line:#e2e8f0;--hero1:#082c44;--hero2:#0e6e8c;--shadow:0 1px 2px rgba(15,34,56,.05),0 10px 28px -8px rgba(15,34,56,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08111c;--card:#111f31;--ink:#eaf1f8;--mut:#91a3b9;--pri:#3fb5d6;--acc:#e0b25a;--line:#22374e;--hero1:#0a2a40;--hero2:#0d5670;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -8px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#08111c;--card:#111f31;--ink:#eaf1f8;--mut:#91a3b9;--pri:#3fb5d6;--acc:#e0b25a;--line:#22374e;--hero1:#0a2a40;--hero2:#0d5670;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -8px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 28px}
.top{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 18px}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:.2px}
.yr{font-size:12.5px;font-weight:600;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 10%,transparent);padding:2px 10px;border-radius:99px}
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(255,255,255,.14),transparent 55%),linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:24px;padding:20px 22px 22px;box-shadow:0 20px 40px -14px rgba(8,44,68,.6),0 0 0 1px rgba(74,222,128,.45),0 0 28px 4px rgba(74,222,128,.4);position:relative;overflow:hidden;animation:glow 4.5s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 20px 40px -14px rgba(8,44,68,.6),0 0 0 1px rgba(74,222,128,.22),0 0 14px 1px rgba(74,222,128,.2)}50%{box-shadow:0 20px 40px -14px rgba(8,44,68,.6),0 0 0 2px rgba(74,222,128,.75),0 0 48px 12px rgba(74,222,128,.6),0 0 90px 24px rgba(74,222,128,.25)}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}
.hero:before{content:"";position:absolute;inset-inline-end:-46px;bottom:-60px;width:170px;height:170px;border-radius:50%;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 26px rgba(255,255,255,.04),0 0 0 52px rgba(255,255,255,.03);pointer-events:none}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:4px 12px;border-radius:99px;position:relative}
.live i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25);animation:p 1.8s infinite}
@keyframes p{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;position:relative}
.hinfo b{font-size:23px;font-weight:700;display:block;line-height:1.3}
.tm{display:inline-block;margin-top:6px;font-size:12.5px;background:rgba(255,255,255,.14);padding:2px 10px;border-radius:8px;opacity:.95}
.hd{display:block;margin-top:10px;font-size:13px;opacity:.78}
.big{flex:none;width:92px;height:92px;border-radius:26px;background:linear-gradient(160deg,#fff,#dbe9f1);color:var(--hero1);font-size:48px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 5px rgba(255,255,255,.14),0 12px 24px -8px rgba(0,0,0,.4)}
.hero:before{display:none}

.sky canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen}
.live,.tm{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hinfo b,.hd,.tm,.live,.clk{text-shadow:0 1px 8px rgba(0,0,0,.5)}
.toprow{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
#ck{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.sky:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(6,20,38,.26),rgba(6,20,38,.46))}
.clk{position:relative;z-index:1;margin-top:18px;text-align:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.clk b{display:block;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;letter-spacing:.5px;line-height:1.2}
.clk b span{font-size:.55em;opacity:.85}
.sel{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 16px}
.dd>button{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font:inherit;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer;box-shadow:var(--shadow);text-align:start;transition:border-color .15s,box-shadow .15s}
.dd>button span small{display:block;color:var(--mut);font-size:11.5px;font-weight:400}
.dd.open>button{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.dd>button:after{content:"";flex:none;width:8px;height:8px;border-inline-end:2px solid var(--pri);border-bottom:2px solid var(--pri);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.dd.open>button:after{transform:rotate(225deg) translateY(-2px)}
.menu{display:none;position:absolute;top:calc(100% + 8px);inset-inline:0;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 48px -12px rgba(8,30,50,.35);max-height:330px;overflow:auto;padding:10px;z-index:10;gap:6px}
.dd.open .menu{display:grid}
#mm{grid-template-columns:repeat(3,1fr)}
#md{grid-template-columns:repeat(4,1fr)}
.menu button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;border:1px solid transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:600;line-height:1.3;padding:8px 4px;border-radius:12px;cursor:pointer;text-align:center}
#md button{font-size:17px;font-weight:700}
.menu button:hover{background:color-mix(in srgb,var(--pri) 10%,transparent)}
.menu button.on{background:var(--pri);color:#fff;box-shadow:0 6px 14px -6px var(--pri)}
.menu button em{font-style:normal;font-weight:400;opacity:.65;font-size:11px}
.tdy{display:block;margin:-4px auto 16px;background:color-mix(in srgb,var(--acc) 10%,var(--card));color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);border-radius:99px;padding:8px 22px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,box-shadow .15s}
.tdy:hover{background:color-mix(in srgb,var(--acc) 18%,var(--card))}
.tdy:active{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.date{text-align:center;color:var(--mut);font-size:13.5px;margin:0 0 14px;line-height:1.7}
.date b{color:var(--ink);font-size:16.5px;font-weight:700}
.sh{position:relative;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.sh.now{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent),var(--shadow)}
.ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,transparent)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx{flex:1;min-width:0}
.sh h3{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.sh p{margin:2px 0 0;color:var(--mut);font-size:13px}
.tag{background:var(--acc);color:#fff;font-size:11px;font-weight:600;padding:1px 9px;border-radius:99px}
.g{flex:none;width:56px;height:56px;border-radius:17px;color:#fff;font-size:28px;font-weight:800;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%),var(--gc);box-shadow:0 8px 16px -8px var(--gc)}
.g0{--gc:#2563eb}.g1{--gc:#0f9d6a}.g2{--gc:#d97706}.g3{--gc:#8b3fd1}.g4{--gc:#dc2f4b}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:18px}
</style>
